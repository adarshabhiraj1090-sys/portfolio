<!DOCTYPE html>
<html>
<head>
<title>My AI Chat</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(135deg, #141e30, #243b55);
    color: white;
    margin: 0;
}

/* Header */
h1 {
    background: black;
    padding: 15px;
    margin: 0;
}

/* Chatbox */
#chatbox {
    width: 95%;
    max-width: 500px;
    margin: 20px auto;
    padding: 15px;
    height: 350px;
    overflow-y: auto;
    background: rgba(255,255,255,0.05);
    border-radius: 15px;
}

/* Messages */
.user {
    background: #00bcd4;
    padding: 8px 12px;
    border-radius: 15px;
    display: inline-block;
    margin: 5px;
    float: right;
    clear: both;
    box-shadow: 0 0 10px rgba(0,255,255,0.5);
}

.bot {
    background: #444;
    padding: 8px 12px;
    border-radius: 15px;
    display: inline-block;
    margin: 5px;
    float: left;
    clear: both;
    box-shadow: 0 0 10px rgba(255,255,255,0.2);
}

 .time{
    font-size:10px;
    opacity:0.7;
    margin-top:4px;
 }

/* Input area */
.input-area {
    position: fixed;
    bottom: 0;
    width: 100%;
    background: black;
    padding: 10px;
}

/* Input box */
input {
    width: 60%;
    padding: 10px;
    border-radius: 20px;
    border: none;
}

/* Buttons */
button {
    padding: 10px;
    border: none;
    border-radius: 50%;
    background: cyan;
    margin: 5px;
    cursor: pointer;
}

.message{
    animation: pop 0.3s ease;
}

@keyframes pop{
    from{
        transform: scale(0.8);
        opacity:0;
    }
    to{
        transform: scale(1);
        opacity:1;
    }
}

#status{
    color:#00ff99;
    font-size:14px;
    margin-left:10px;
    margin-bottom:5px;
}

.light-mode{
    background:white;
    color:black;
}

.light-mode #chatbox{
    background:#f1f1f1;
}

.light-mode .bot{
    background:#ddd;
    color:black;
}

.header{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px;
    background:#111;
}

.header img{
    width:50px;
    height:50px;
    border-radius:50%;
}

.header h1{
    margin:0;
    font-size:20px;
}

.header p{
    margin:0;
    font-size:12px;
    color:lightgreen;
}

.chat-image{
    width:200px;
    border-radius:10px;
    margin-top:5px;
}

#voiceSelect{
    padding:5px;
    border-radius:10px;
    margin:5px;
    background:cyan;
    border:none;
}

#emojiBox span{
    font-size:25px;
    cursor:pointer;
    margin:5px;
}

#emojiBox{
display:flex;
gap:10px;
margin:10px;
font-size:25px;
}

.input-area{
display:flex;
align-items:center;
gap:8px;
padding:10px;
flex-wrap:wrap;
background:black;
position:fixed;
bottom:0;
width:100%;
}

.input-area input[type="text"]{
flex:1;
padding:10px;
border-radius:20px;
border:none;
}

.input-area button{
border:none;
padding:10px;
border-radius:50%;
background:cyan;
}

input[type="file"]{
font-size:11px;
color:white;
width:120px;
}

.upload-btn{
background:cyan;
padding:10px;
border-radius:50%;
font-size:18px;
display:flex;
align-items:center;
justify-content:center;
}
    
</style>

</head>

<body>

<div class="header">

    <img src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png">

    <div>
        <h1>Adarsh AI</h1>
        <p>Smart Assistant 🤖</p>
    </div>

</div>

<div id="status">🟢 Online</div>

<button onclick="toggleMode()">🌙 Mode</button>

<select id="voiceSelect">

<option value="0">🤖 Default</option>

<option value="1">👩 Female</option>

<option value="2">😎 Male</option>

</select>

<div id="chatbox"></div>
<div id="emojiBox">

<span onclick="addEmoji('😀')">😀</span>

<span onclick="addEmoji('😂')">😂</span>

<span onclick="addEmoji('🔥')">🔥</span>

<span onclick="addEmoji('😎')">😎</span>

<span onclick="addEmoji('❤️')">❤️</span>

</div>

<input type="text" id="userInput" placeholder="Type message...">

<div class="input-area">

<input type="text" id="userInput" placeholder="Type message...">

<button onclick="send()">➤</button>

<button onclick="startVoice()">🎤</button>

<button onclick="clearChat()">🗑️</button>

<button onclick="toggleMode()">🌙</button>

<button onclick="startJarvis()">🤖 Jarvis</button>

<label class="upload-btn">
🖼️
<input type="file" id="imageInput" accept="image/*" hidden>
</label>

<label class="upload-btn">
📸
<input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
</label>

</div>

<script>

 let isVoice = false;

// 🔹 Load chat
window.onload = function () {
    let saved = localStorage.getItem("chat");
    if (saved) {
        document.getElementById("chatbox").innerHTML = saved;
    }
};

if(localStorage.getItem("theme") === "light"){

    document.body.classList.add("light-mode");

}

// 🔹 Send message
function send(msgFromVoice = "") {

    let input = msgFromVoice || document.getElementById("userInput").value.trim();

    if (input === "") return;

    let chatbox = document.getElementById("chatbox");

    // USER MESSAGE
    chatbox.innerHTML += `
    <div class="user">
        You: ${input}

        <div style="font-size:10px;opacity:0.7;">
        ${new Date().toLocaleTimeString([], {
        hour:'2-digit',
        minute:'2-digit'
        })}
       </div>
       
        <div style="font-size:10px;">
            ${new Date().getHours()}:${String(new Date().getMinutes()).padStart(2,'0')}
        </div>
    </div>`;

    // INPUT CLEAR
    document.getElementById("userInput").value = "";

    // TYPING
    chatbox.innerHTML += `
    <div class="bot" id="typing">
        ⏳ Typing...
    </div>`;

    chatbox.scrollTo({
        top: chatbox.scrollHeight,
        behavior: "smooth"
    });

    // BOT REPLY
    setTimeout(() => {

        document.getElementById("typing").remove();

        let reply = getReply(input);

        chatbox.innerHTML += `
        <div class="bot">
            Bot: ${reply}

       <div style="font-size:10px;opacity:0.7;">
       ${new Date().toLocaleTimeString([], {
        hour:'2-digit',
        minute:'2-digit'
        })}
        </div>
            
        </div>`;

        if(msgFromVoice){
    speak(reply);
        }

        chatbox.scrollTo({
            top: chatbox.scrollHeight,
            behavior: "smooth"
        });

        // SAVE CHAT
        localStorage.setItem("chat", chatbox.innerHTML);

    }, 1000);
}

// 🔹 Reply logic
function getReply(msg) {

let savedName = localStorage.getItem("username");

    msg = msg.toLowerCase();

    if(msg.includes("my name is")){

    let name = msg.replace("my name is", "").trim();

    localStorage.setItem("username", name);

    return `Nice to meet you ${name} 😎`;
}

if(msg.includes("what is my name")){

    if(savedName){
        return `Your name is ${savedName} 😊`;
    }else{
        return "Mujhe abhi tumhara naam nahi pata 😅";
    }
}

    // Greetings
    if (msg.includes("hi") || msg.includes("hello"))
        return "👋 Hello! Kaise ho? 😄";

    if (msg.includes("kaise ho"))
        return "😎 Main mast hu! Tum kaise ho? 🤗";

    // Name
    if (msg.includes("tum kon ho"))
        return "Main Adarsh ka AI Assistant hu 🤖";

    if (msg.includes("mera naam"))
        return "main Adarsh ke duara banaya gaya ai assistant ho ";

    // Coding
    if (msg.includes("mujhe coding sekhna hai"))
        return "Coding daily practice se aati hai 💻";

    // Rich
    if (msg.includes("rich/bada aadmi kise bane") || msg.includes("paisa"))
        return "Bada aadmi banne ke liye skills + consistency chahiye 🚀";

    // Elon Musk
    if (msg.includes("elon musk kon hai"))
        return "Elon Musk duniya ke top innovators me se ek hai 🚀";

    // Help
    if (msg.includes("please help me"))
        return "bilkul main aapki kya help kar sakta hu 🗣️";

    // Time
    if (msg.includes("time"))
        return "Mujhe exact time nahi pata 😊";

    // Who made you
    if (msg.includes("who made you") || msg.includes("kisne banaya"))
        return "Mujhe Adarsh ne banaya hai 😎";

    // Motivation
    if (msg.includes("motivate matlab kya hota hai"))
        return "Never give up  Tum bahut bada kar sakte ho";

    // Bye
    if (msg.includes("bye"))
        return "Bye 👋 take care,and hit me up anytime you want to chat or need help be something🚀";

    // Default random replies
    let replies = [
        "🤔 Thoda aur clearly pucho",
        " Samajh nahi aaya",
        " sorry i couldn't understand 😔",
        
        "🤖 Main abhi sirf basic level janta hu"
    ];

    return replies[Math.floor(Math.random() * replies.length)];
}

// 🔹 Voice input (MAIN FIX)
function startVoice() {

    isVoice = true;
    let recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();

    recognition.lang = "en-IN";
    recognition.start();

    recognition.onstart = function () {
        alert("🎤 Listening...");
    };

    recognition.onresult = function (event) {
        let voiceText = event.results[0][0].transcript;
        send(voiceText); // 👈 direct send
    };

    recognition.onerror = function () {
        alert("Voice error 😢 Try again");
    };
}

// 🔹 Voice output
 function speak(text){

    speechSynthesis.cancel();

    let speech = new SpeechSynthesisUtterance(text);

    let voices = window.speechSynthesis.getVoices();

    let selected =
    document.getElementById("voiceSelect").value;

    // Default
    if(selected == "0"){
        speech.voice = voices[0];
    }

    // Female
    else if(selected == "1"){

        let femaleVoice =
        voices.find(v =>
            v.name.toLowerCase().includes("female") ||
            v.name.toLowerCase().includes("zira") ||
            v.name.toLowerCase().includes("samantha")
        );

        speech.voice = femaleVoice || voices[1];
    }

    // Male
    else if(selected == "2"){

        let maleVoice =
        voices.find(v =>
            v.name.toLowerCase().includes("male") ||
            v.name.toLowerCase().includes("david") ||
            v.name.toLowerCase().includes("alex")
        );

        speech.voice = maleVoice || voices[2];
    }

    speech.rate = 1;

    speech.pitch = 1;

    speech.volume = 1;

    speechSynthesis.speak(speech);
 }

// 🔹 Clear chat
function clearChat() {
    localStorage.removeItem("chat");
    document.getElementById("chatbox").innerHTML = "";
}

// 🔹 Enter key
document.getElementById("userInput").addEventListener("keypress", function(e) {
    if (e.key === "Enter") {
        send();
    }
});

// 🔹 Scroll
function scrollDown() {
    let chatbox = document.getElementById("chatbox");
    chatbox.scrollTo({
        top: chatbox.scrollHeight,
        behavior: "smooth"
    });
}
function startJarvis() {

    let recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = "en-US"; // या hi-IN
    recognition.continuous = true;

    recognition.onresult = function(event) {
        let last = event.results.length - 1;
        let text = event.results[last][0].transcript;

        document.getElementById("userInput").value = text;

        send(); // auto send

    setTimeout(() => {
    speak(getReply(input.value));
}, 1000);
    };

    recognition.start();
}
let userName = localStorage.getItem("name") || "";

function saveName(msg) {
    if (msg.includes("my name is")) {
        userName = msg.split("my name is")[1].trim();
        localStorage.setItem("name", userName);
        return `Nice to meet you ${userName} 😊`;
    }
}

document.getElementById("userInput")
.addEventListener("keypress", function(e){

    if(e.key === "Enter"){
        send();
    }

});

function toggleMode(){

    document.body.classList.toggle("light-mode");

    if(document.body.classList.contains("light-mode")){

        localStorage.setItem("theme","light");

    }else{

        localStorage.setItem("theme","dark");

    }

}

document.getElementById("imageInput").addEventListener("change", function(){

    let file = this.files[0];

    if(!file) return;

    let reader = new FileReader();

    reader.onload = function(e){

        let chatbox = document.getElementById("chatbox");

        chatbox.innerHTML += `
        <div class="user">
            <img src="${e.target.result}" class="chat-image">
        </div>
        `;

        chatbox.scrollTo({
            top: chatbox.scrollHeight,
            behavior: "smooth"
        });

        localStorage.setItem("chat", chatbox.innerHTML);
    };

    reader.readAsDataURL(file);

});

speechSynthesis.onvoiceschanged = () => {
    speechSynthesis.getVoices();
};

function addEmoji(emoji){

document.getElementById("userInput").value += emoji;

}

</script>

</body>
</html>
