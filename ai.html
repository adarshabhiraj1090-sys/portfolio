<!DOCTYPE html>
<html>
<head>
<title>Adarsh AI</title>

<style>

body{
    font-family:Arial;
    margin:0;
    background:linear-gradient(135deg,#141e30,#243b55);
    color:white;
}

/* HEADER */
.header{
    display:flex;
    align-items:center;
    gap:10px;
    background:#111;
    padding:10px;
}

.header img{
    width:50px;
    height:50px;
    border-radius:50%;
}

.header h1{
    margin:0;
    font-size:22px;
}

.header p{
    margin:0;
    color:lightgreen;
    font-size:12px;
}

/* STATUS */
#status{
    color:#00ff99;
    margin:10px;
    font-size:14px;
}

/* CHATBOX */
#chatbox{
    width:90%;
    max-width:500px;
    height:420px;
    overflow-y:auto;
    margin:10px auto 120px auto;
    padding:15px;
    border-radius:15px;
    background:rgba(255,255,255,0.05);
}

/* MESSAGES */
.user{
    background:#00bcd4;
    padding:10px;
    margin:8px;
    border-radius:15px;
    float:right;
    clear:both;
    max-width:80%;
}

.bot{
    background:#444;
    padding:10px;
    margin:8px;
    border-radius:15px;
    float:left;
    clear:both;
    max-width:80%;
}

/* INPUT AREA */
.input-area{
    position:fixed;
    bottom:0;
    width:100%;
    background:black;
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px;
}

.input-area input{
    flex:1;
    padding:12px;
    border:none;
    border-radius:20px;
}

.input-area button{
    border:none;
    padding:10px;
    border-radius:50%;
    background:cyan;
    cursor:pointer;
}

/* EMOJI */
#emojiBox{
    margin-left:10px;
    font-size:25px;
}

#emojiBox span{
    cursor:pointer;
    margin-right:8px;
}

/* IMAGE */
.chat-image{
    width:200px;
    border-radius:10px;
}

/* LIGHT MODE */
.light-mode{
    background:white;
    color:black;
}

.light-mode #chatbox{
    background:#f1f1f1;
}

.light-mode .bot{
    background:#ddd;
    color:black;
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">

<img src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png">

<div>
<h1>Adarsh AI</h1>
<p>Smart Assistant 🤖</p>
</div>

</div>

<!-- STATUS -->
<div id="status">🟢 Online</div>

<!-- MODE -->
<button onclick="toggleMode()" style="margin-left:10px;border:none;padding:8px 15px;border-radius:20px;background:cyan;">
🌙 Mode
</button>

<!-- VOICE -->
<select id="voiceSelect" style="padding:8px;border-radius:10px;background:cyan;border:none;">

<option value="0">🤖 Default</option>
<option value="1">👩 Female</option>
<option value="2">😎 Male</option>

</select>

<!-- CHATBOX -->
<div id="chatbox"></div>

<!-- EMOJI -->
<div id="emojiBox">

<span onclick="addEmoji('😀')">😀</span>
<span onclick="addEmoji('😂')">😂</span>
<span onclick="addEmoji('🔥')">🔥</span>
<span onclick="addEmoji('😎')">😎</span>
<span onclick="addEmoji('❤️')">❤️</span>

</div>

<!-- INPUT -->
<div class="input-area">

<input
type="text"
id="userInput"
placeholder="Type message..."
>

<button onclick="send()">➤</button>

<button onclick="startVoice()">🎤</button>

<button onclick="clearChat()">🗑️</button>

<label style="background:cyan;padding:10px;border-radius:50%;cursor:pointer;">
🖼️
<input type="file" id="imageInput" hidden>
</label>

</div>

<script>

// API KEY
const API_KEY = prompt("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");

// LOAD CHAT
window.onload = function(){

    let saved =
    localStorage.getItem("chat");

    if(saved){
        document.getElementById("chatbox").innerHTML = saved;
    }

    if(localStorage.getItem("theme") === "light"){
        document.body.classList.add("light-mode");
    }
};

// SEND MESSAGE
async function send(msgFromVoice = ""){

    let input =
    msgFromVoice ||
    document.getElementById("userInput").value.trim();

    if(input === "") return;

    let chatbox =
    document.getElementById("chatbox");

    // USER MESSAGE
    chatbox.innerHTML += `
    <div class="user">
        ${input}
    </div>
    `;

    document.getElementById("userInput").value = "";

    // TYPING
    chatbox.innerHTML += `
    <div class="bot" id="typing">
        ⏳ Typing...
    </div>
    `;

    scrollDown();

    // AI REPLY
    setTimeout(async ()=>{

        document.getElementById("typing").remove();

        let reply =
        await getReply(input);

        chatbox.innerHTML += `
        <div class="bot">
            ${reply}
        </div>
        `;

        if(msgFromVoice){
            speak(reply);
        }

        scrollDown();

        localStorage.setItem(
            "chat",
            chatbox.innerHTML
        );

    },1000);
}

// GET REPLY
async function getReply(msg){

    try{

        let response = await fetch(
        "https://openrouter.ai/api/v1/chat/completions",
        {

            method:"POST",

            headers:{

                "Content-Type":"application/json",

                "Authorization":
                `Bearer ${API_KEY}`,

                "HTTP-Referer":
                "https://adarshabhiraj1090-sys.github.io",

                "X-Title":
                "Adarsh AI"
            },

            body:JSON.stringify({

                model:
                "openai/gpt-3.5-turbo",

                messages:[
                    {
                        role:"system",
                        content:
                        "You are Adarsh AI Assistant. Reply in Hindi-English."
                    },
                    {
                        role:"user",
                        content:msg
                    }
                ],

                max_tokens:100

            })

        });

        let data =
        await response.json();

        console.log(data);

        if(data.error){
            return "❌ " + data.error.message;
        }

        return data.choices[0].message.content;

    }catch(error){

        return "⚠️ API Error";
    }
}

// VOICE INPUT
function startVoice(){

    let recognition =
    new (
        window.SpeechRecognition ||
        window.webkitSpeechRecognition
    )();

    recognition.lang = "en-IN";

    recognition.start();

    recognition.onstart = function(){
        alert("🎤 Listening...");
    };

    recognition.onresult = function(event){

        let text =
        event.results[0][0].transcript;

        send(text);
    };

    recognition.onerror = function(){
        alert("Voice error 😢");
    };
}

// SPEAK
function speak(text){

    speechSynthesis.cancel();

    let speech =
    new SpeechSynthesisUtterance(text);

    let voices =
    speechSynthesis.getVoices();

    let selected =
    document.getElementById("voiceSelect").value;

    if(selected == "0"){
        speech.voice = voices[0];
    }

    else if(selected == "1"){

        let female =
        voices.find(v =>
            v.name.toLowerCase().includes("female") ||
            v.name.toLowerCase().includes("zira")
        );

        speech.voice =
        female || voices[1];
    }

    else if(selected == "2"){

        let male =
        voices.find(v =>
            v.name.toLowerCase().includes("david") ||
            v.name.toLowerCase().includes("alex")
        );

        speech.voice =
        male || voices[2];
    }

    speech.rate = 1;

    speech.pitch = 1;

    speechSynthesis.speak(speech);
}

// CLEAR CHAT
function clearChat(){

    localStorage.removeItem("chat");

    document.getElementById("chatbox").innerHTML = "";
}

// ENTER KEY
document
.getElementById("userInput")
.addEventListener("keypress",function(e){

    if(e.key === "Enter"){
        send();
    }
});

// SCROLL
function scrollDown(){

    let chatbox =
    document.getElementById("chatbox");

    chatbox.scrollTo({

        top:chatbox.scrollHeight,

        behavior:"smooth"

    });
}

// MODE
function toggleMode(){

    document.body.classList.toggle("light-mode");

    if(document.body.classList.contains("light-mode")){

        localStorage.setItem("theme","light");

    }else{

        localStorage.setItem("theme","dark");
    }
}

// IMAGE UPLOAD
document
.getElementById("imageInput")
.addEventListener("change",function(){

    let file =
    this.files[0];

    if(!file) return;

    let reader =
    new FileReader();

    reader.onload = function(e){

        let chatbox =
        document.getElementById("chatbox");

        chatbox.innerHTML += `
        <div class="user">
            <img src="${e.target.result}" class="chat-image">
        </div>
        `;

        scrollDown();

        localStorage.setItem(
            "chat",
            chatbox.innerHTML
        );
    };

    reader.readAsDataURL(file);

});

// EMOJI
function addEmoji(emoji){

    document.getElementById("userInput").value += emoji;
}

</script>

</body>
</html>
